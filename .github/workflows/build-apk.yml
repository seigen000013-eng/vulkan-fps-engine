name: Build APK

# Jalan otomatis tiap push, dan bisa juga ditekan manual dari tab Actions.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # Toolchain. Android SDK sudah terpasang di runner ubuntu-latest;
      # NDK dan CMake sudah ada di runner; tidak ada yang perlu dipasang.
      # ---------------------------------------------------------------
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Runner ubuntu-latest SUDAH membawa Android SDK, NDK, dan CMake.
      # Versi pertama workflow ini memanggil sdkmanager untuk memasang versi NDK
      # tertentu, dan di situ ia mati dalam 8 detik — entah karena sdkmanager
      # tidak ada di PATH, ANDROID_SDK_ROOT kosong, atau versi NDK yang saya
      # sebut sudah tidak tersedia.
      #
      # Memasang apa pun di sini tidak perlu: biarkan Android Gradle Plugin
      # memakai NDK yang sudah ada. Langkah di bawah cuma MENCETAK apa yang
      # tersedia, jadi kalau tetap gagal, log-nya menyebutkan versi mana yang
      # ada alih-alih membuat kita menebak.
      - name: Periksa toolchain
        run: |
          echo "ANDROID_HOME     = ${ANDROID_HOME:-<kosong>}"
          echo "ANDROID_SDK_ROOT = ${ANDROID_SDK_ROOT:-<kosong>}"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "--- NDK terpasang ---"
          ls -1 "$SDK/ndk" 2>/dev/null || echo "  (tidak ada folder ndk)"
          echo "--- CMake terpasang ---"
          ls -1 "$SDK/cmake" 2>/dev/null || echo "  (tidak ada folder cmake)"
          java -version 2>&1

      # ---------------------------------------------------------------
      # Dependensi sumber. Keduanya di-clone dengan --depth 1 supaya
      # tidak menarik seluruh riwayat git.
      # ---------------------------------------------------------------
      # Tag rilis bisa bergeser. Kalau tag yang disebut tidak ada, jatuh ke
      # cabang default alih-alih menggagalkan build karena satu nama.
      - name: SDL3
        run: |
          set -e
          git clone --depth 1 --branch release-3.2.10 \
              https://github.com/libsdl-org/SDL.git app/src/main/cpp/SDL3 \
            || git clone --depth 1 \
              https://github.com/libsdl-org/SDL.git app/src/main/cpp/SDL3

          # Sumber Java SDL (org/libsdl/app) DISALIN ke modul app kita.
          #
          # Jangan menyertakan android-project/app milik SDL sebagai modul
          # Gradle: folder itu modul APLIKASI lengkap dengan plugin
          # com.android.application sendiri, dan satu build tidak boleh punya
          # dua modul aplikasi. Gradle menolak sebelum mengompilasi apa pun.
          SDLJAVA=app/src/main/cpp/SDL3/android-project/app/src/main/java
          test -d "$SDLJAVA/org/libsdl/app" \
            || { echo "GAGAL: sumber Java SDL tidak ada di $SDLJAVA"; \
                 find app/src/main/cpp/SDL3 -name SDLActivity.java; exit 1; }
          mkdir -p app/src/main/java
          cp -r "$SDLJAVA/org" app/src/main/java/
          echo "Kelas Java SDL yang disalin: $(find app/src/main/java/org -name '*.java' | wc -l)"

          # android-project milik SDL DIBUANG setelah sumber Java-nya diambil.
          #
          # Di dalamnya ada gradle/wrapper/gradle-wrapper.jar, dan
          # setup-gradle memvalidasi SETIAP gradle-wrapper.jar di workspace
          # terhadap daftar checksum resmi. Jar milik SDL tidak ada di daftar
          # itu, jadi seluruh build dihentikan dengan:
          #
          #   Error: At least one Gradle Wrapper Jar failed validation!
          #
          # Kita tidak memakai android-project sama sekali — cuma sumber Java
          # di dalamnya, dan itu sudah disalin di atas.
          rm -rf app/src/main/cpp/SDL3/android-project
          echo "gradle-wrapper.jar tersisa di workspace: $(find . -name gradle-wrapper.jar | wc -l)"

      - name: GLM
        run: |
          set -e
          git clone --depth 1 --branch 1.0.1 \
            https://github.com/g-truc/glm.git /tmp/glm
          cp -r /tmp/glm/glm app/src/main/cpp/glm

      # ---------------------------------------------------------------
      # Shader. glslc datang dari paket glslang-tools; namanya di sana
      # glslangValidator, dan compile_shaders.sh sudah punya jalur
      # fallback untuk itu.
      #
      # VK_ENV=vulkan1.1 WAJIB: driver Mali-G52 melaporkan 1.1.131 dan
      # akan menolak SPIR-V 1.6.
      # ---------------------------------------------------------------
      - name: Kompilasi shader
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          chmod +x compile_shaders.sh
          VK_ENV=vulkan1.1 ./compile_shaders.sh shaders.cpp .

      - name: Salin aset ke APK
        run: |
          set -e
          mkdir -p app/src/main/assets
          cp *.spv app/src/main/assets/
          cp tree.obj app/src/main/assets/
          echo "Aset yang masuk APK:"
          ls -1 app/src/main/assets/ | sed 's/^/  /'
          test "$(ls app/src/main/assets/*.spv | wc -l)" -ge 18 \
            || { echo "GAGAL: .spv terlalu sedikit"; exit 1; }

      - name: Salin main2.cpp ke modul native
        run: cp main2.cpp app/src/main/cpp/main2.cpp

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------
      # Gradle dipasang langsung, TIDAK lewat ./gradlew.
      #
      # Gradle wrapper butuh gradle-wrapper.jar — berkas BINER yang merepotkan
      # diunggah lewat browser HP, dan tanpa jar itu ./gradlew gagal dengan
      # pesan yang membingungkan ("ClassNotFoundException: GradleWrapperMain").
      # Runner ini bisa memasang Gradle sendiri, jadi wrapper tidak diperlukan
      # sama sekali.
      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          # Sabuk pengaman kedua. Kita tidak memakai wrapper sama sekali, jadi
          # tidak ada yang perlu divalidasi — dan kalau nanti ada dependensi
          # lain yang membawa jar wrapper sendiri, build tidak ikut mati.
          validate-wrappers: false

      - name: Build APK
        run: |
          # set -o pipefail WAJIB, dan ketiadaannya adalah bug saya di versi
          # sebelumnya.
          #
          # Di dalam pipeline `gradle ... | tee log`, status keluar yang dilihat
          # shell adalah status PERINTAH TERAKHIR — yaitu tee, yang hampir
          # selalu 0. Jadi ketika gradle GAGAL, langkah ini tetap dianggap
          # BERHASIL, blok penanganan error tidak pernah jalan, dan kegagalan
          # baru muncul di langkah berikutnya sebagai
          # "No files were found with the provided path: .../*.apk" —
          # gejala yang menyesatkan, karena masalahnya bukan di pengunggahan.
          #
          # pipefail membuat status pipeline mengikuti perintah yang gagal.
          set -o pipefail

          gradle assembleDebug --no-daemon --info 2>&1 | tee /tmp/gradle.log || {
              echo ""
              echo "=================== PENYEBAB KEGAGALAN ==================="
              sed -n '/What went wrong/,/^\* Try:/p' /tmp/gradle.log | head -60
              echo ""
              echo "--- baris yang mengandung 'error:' ---"
              grep -i "error:" /tmp/gradle.log | head -30 || true
              echo "========================================================="
              exit 1
          }

          echo "--- isi app/build/outputs ---"
          find app/build/outputs -type f 2>/dev/null | head -20 \
            || echo "  (folder outputs tidak ada)"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: VulkanFPS-debug-apk
          # Pola diperluas: kalau AGP menaruh APK di subfolder lain (mis. per
          # ABI), ia tetap terjaring.
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
